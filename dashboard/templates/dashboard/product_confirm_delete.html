{% extends 'dashboard/base.html' %}

{% block title %}Delete Product - Dashboard{% endblock %}

{% block content %}
<div class="page-header">
    <h1 class="page-title">⚠️ Delete Product</h1>
</div>

<div class="form-container" style="max-width: 500px;">
    <div style="padding: 1.5rem; background-color: #f8d7da; border: 1px solid #f5c6cb; border-radius: 4px; margin-bottom: 2rem;">
        <h2 style="color: #721c24; margin-bottom: 1rem;">Are you sure?</h2>
        <p style="color: #721c24; margin-bottom: 1rem;">
            You are about to delete the product: <strong>{{ product.name }}</strong>
        </p>
        <p style="color: #721c24;">This action cannot be undone.</p>
    </div>
    
    <form method="post">
        {% csrf_token %}
        <div class="form-buttons">
            <button type="submit" class="btn btn-danger">Yes, Delete Product</button>
            <a href="{% url 'dashboard:products_list' %}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
