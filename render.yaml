# Render blueprint: https://render.com/docs/blueprint-spec
#
# Creates the web service, a managed Postgres instance, and a persistent disk
# for user uploads. DATABASE_URL is wired from the database automatically --
# it is the setting whose absence caused the "unable to open database file"
# error, so it must never be left unset.
databases:
  - name: avee-foods-db
    databaseName: avee_foods
    plan: basic-256mb

services:
  - type: web
    name: avee-foods
    runtime: python
    plan: starter
    buildCommand: "./build.sh"
    startCommand: "gunicorn avee_foods.wsgi:application"
    healthCheckPath: /
    # Uploaded product/gallery images. Without a disk these live on the
    # container filesystem and vanish on every redeploy.
    disk:
      name: media
      mountPath: /var/data/media
      sizeGB: 1
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: avee-foods-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_MEDIA_ROOT
        value: /var/data/media
      - key: PYTHON_VERSION
        value: "3.12.13"
